apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-job
  namespace: inventory-prod
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-init-container
          image: postgres:16-alpine
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: PGHOST
              value: postgres-svc

            - name: PGPORT
              value: "5432"

          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."

              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                sleep 5
              done

              echo "Creating database if not exists..."

              psql -h "$PGHOST" -U "$PGUSER" -d postgres \
                -v dbname="$PGDATABASE" -v dbuser="$PGUSER" <<'EOF'

              SELECT 'CREATE DATABASE "' || :'dbname' || '"'
              WHERE NOT EXISTS (
                SELECT FROM pg_database WHERE datname = :'dbname'
              )\gexec

              SELECT 'GRANT ALL PRIVILEGES ON DATABASE "' || :'dbname' || '" TO "' || :'dbuser' || '"'\gexec

              EOF

              echo "Database ready!"