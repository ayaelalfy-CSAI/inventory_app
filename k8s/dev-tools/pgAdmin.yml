apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  namespace: inventory-dev
spec:
  
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "200Mi"

          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-svc.inventory-prod.svc.cluster.local -p 5432 -U admin -d inventory_app;
              do echo "Waiting for postgres..."; sleep 2; done
              echo "Postgres is ready!"
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.17
          ports:
            - containerPort: 80    
              name: web-ui
          envFrom:
            - secretRef:
                name: pgadmin-secret
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
              ephemeral-storage: "1Gi"
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-svc
  namespace: inventory-dev
  labels:
    app: pgadmin
spec:
  type: ClusterIP
  selector:
    app: pgadmin
  ports:
    - name: web-ui
      port: 80
      targetPort: 80              