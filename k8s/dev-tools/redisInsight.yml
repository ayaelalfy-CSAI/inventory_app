apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight-deployment
  namespace: inventory-dev
spec:
  automountServiceAccountToken: false
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis-svc.inventory-prod.svc.cluster.local -p 6379 -a $REDIS_PASSWORD ping;
              do echo "Waiting for redis..."; sleep 2; done
              echo "Redis is ready!"

      containers:
      - name: redis-insight
        image: redis/redisinsight:3.8.0
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
          requests:
            memory: "256Mi"
            cpu: "250m"  
            ephemeral-storage: "1Gi"
        ports:
        - containerPort: 5540

---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight-service
  labels:
    app: redis-insight
  namespace: inventory-dev
spec:
  type: ClusterIP
  selector:
    app: redis-insight
  ports:
  - port: 5540
    targetPort: 5540