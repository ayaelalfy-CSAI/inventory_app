apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-scheduler
  namespace: inventory-prod
  labels:
    app: inventory-scheduler

spec:

  replicas: 1 
  strategy:
    type: Recreate # avoid two schedulers racing to register jobs during a rollout

  selector:
    matchLabels:
      app: inventory-scheduler

  template:
    metadata:
      labels:
        app: inventory-scheduler

    spec:
      serviceAccountName: inventory-app-sa
      automountServiceAccountToken: false

      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "200Mi"

          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-svc -U admin -d inventory_app;
              do echo "Waiting for postgres..."; sleep 2; done
              echo "Postgres is ready!"

        - name: wait-for-redis
          image: redis:7-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis-service -p 6379 -a "$REDIS_PASSWORD" ping;
              do echo "Waiting for redis..."; sleep 2; done
              echo "Redis is ready!"

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: inventory-scheduler
          image: ayaelalfy/inventory_app:101
          imagePullPolicy: Always

          command: ["node", "dist/main.js"]

          ports:
            - containerPort: 3001
              name: internal

          env:
            - name: START_MODE
              value: "scheduler"
            - name: PORT
              value: "3001"

          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: app-secret

          volumeMounts:
            - name: uploads
              mountPath: /app/uploads

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "300m"
              memory: "256Mi"
              ephemeral-storage: "2Gi"

          startupProbe:
            httpGet:
              path: /internal/health
              port: 3001
            failureThreshold: 12
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /internal/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /internal/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

      volumes:
        - name: uploads
          emptyDir: {}