apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/slack_url

    route:
      receiver: 'slack-devops'
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h

      routes:
        - match:
            severity: critical
          receiver: 'slack-critical'
          repeat_interval: 1h

    receivers:
      # DevOps Alerts
      - name: 'slack-devops'
        slack_configs:
          - channel: '#devops-alerts'
            title: '{{ .Status | toUpper }} | {{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
            send_resolved: true

      # Critical Alerts
      - name: 'slack-critical'
        slack_configs:
          - channel: '#critical-alerts'
            title: 'CRITICAL: {{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
            send_resolved: true